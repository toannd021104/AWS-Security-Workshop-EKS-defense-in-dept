apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-notes-image
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    failurePolicy: Fail
  rules:
  - name: require-workshop-signature
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - notes
    verifyImages:
    - imageReferences:
      - 672682388275.dkr.ecr.us-east-1.amazonaws.com/eks-did/notes*
      imageRegistryCredentials:
        secrets:
        - ecr-verify
      mutateDigest: false
      verifyDigest: true
      required: true
      attestors:
      - entries:
        - keys:
            publicKeys: '-----BEGIN PUBLIC KEY-----

              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEzT1EgaHtK3VU8t0CIWkBgf9xCYsI

              rLBOx9AqF6b98yTC88hcNm66GB+EVB9gg622lnT4THzDNyzNIBXgEMWGiw==

              -----END PUBLIC KEY-----

              '
            rekor:
              ignoreTlog: true
