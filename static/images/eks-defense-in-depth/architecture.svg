<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" role="img" aria-labelledby="title description">
  <title id="title">EKS defense in depth reference architecture</title>
  <desc id="description">Public HTTPS traffic passes through Route 53, AWS WAF, and an internet-facing Application Load Balancer to private EKS nodes and pods in two Availability Zones. Operators use IAM, EKS access entries, and Kubernetes RBAC to reach the private cluster API. Pods use EKS Pod Identity for scoped AWS permissions. CloudWatch, CloudTrail, and GuardDuty provide evidence and detection.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#246b9b"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c66b13"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7251a1"/></marker>
    <style>
      text { font-family: "Amazon Ember", "Segoe UI", sans-serif; fill: #20364b; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 19px; fill: #d5e3ef; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .muted { fill: #52677b; }
      .white { fill: #fff; }
      .frame { fill: #f7fafc; stroke: #8da6ba; stroke-width: 2; }
      .public { fill: #fff3e0; stroke: #d78a32; stroke-width: 2; }
      .private { fill: #e8f3fa; stroke: #397ba3; stroke-width: 2; }
      .identity { fill: #f2edfa; stroke: #8564ac; stroke-width: 2; }
      .evidence { fill: #edf2f5; stroke: #718395; stroke-width: 2; }
      .node { fill: #fff; stroke: #8da6ba; stroke-width: 1.5; }
      .flow { fill: none; stroke: #246b9b; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-orange { fill: none; stroke: #c66b13; stroke-width: 3; marker-end: url(#arrow-orange); }
      .flow-purple { fill: none; stroke: #7251a1; stroke-width: 3; marker-end: url(#arrow-purple); }
      .telemetry { fill: none; stroke: #718395; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="1500" height="1080" fill="#fff"/>
  <rect x="0" y="0" width="1500" height="108" fill="#203b55"/>
  <text x="48" y="52" class="title">Amazon EKS | Defense in Depth</text>
  <text x="50" y="84" class="subtitle">Reference architecture • internet edge, private cluster, separated identities, and evidence</text>

  <text x="48" y="155" class="section">1. Public request path</text>
  <rect x="48" y="177" width="180" height="78" rx="12" class="node"/>
  <text x="138" y="209" text-anchor="middle" class="label">Internet user</text>
  <text x="138" y="235" text-anchor="middle" class="small muted">HTTPS :443</text>
  <rect x="288" y="177" width="180" height="78" rx="12" class="node"/>
  <text x="378" y="209" text-anchor="middle" class="label">Route 53</text>
  <text x="378" y="235" text-anchor="middle" class="small muted">DNS only</text>
  <rect x="528" y="177" width="190" height="78" rx="12" class="public"/>
  <text x="623" y="209" text-anchor="middle" class="label">AWS WAF</text>
  <text x="623" y="235" text-anchor="middle" class="small muted">Regional web ACL</text>
  <rect x="778" y="177" width="240" height="78" rx="12" class="public"/>
  <text x="898" y="209" text-anchor="middle" class="label">Internet-facing ALB</text>
  <text x="898" y="235" text-anchor="middle" class="small muted">HTTPS listener • ACM cert</text>
  <path d="M228 216 H280" class="flow"/>
  <path d="M468 216 H520" class="flow"/>
  <path d="M718 216 H770" class="flow-orange"/>
  <text x="1038" y="208" class="small muted">WAF filters HTTP requests;</text>
  <text x="1038" y="232" class="small muted">it does not isolate pods.</text>

  <rect x="48" y="292" width="1404" height="424" rx="18" class="frame"/>
  <text x="76" y="329" class="section">2. Customer VPC | two Availability Zones</text>
  <rect x="82" y="356" width="620" height="321" rx="14" fill="#fff" stroke="#9db1c1" stroke-width="2"/>
  <rect x="742" y="356" width="620" height="321" rx="14" fill="#fff" stroke="#9db1c1" stroke-width="2"/>
  <text x="108" y="390" class="label">Availability Zone A</text>
  <text x="768" y="390" class="label">Availability Zone B</text>

  <rect x="110" y="410" width="260" height="84" rx="10" class="public"/>
  <text x="240" y="442" text-anchor="middle" class="label">Public subnet A</text>
  <text x="240" y="469" text-anchor="middle" class="small">ALB network interface</text>
  <rect x="414" y="410" width="260" height="84" rx="10" class="private"/>
  <text x="544" y="442" text-anchor="middle" class="label">Private subnet A</text>
  <text x="544" y="469" text-anchor="middle" class="small">Managed node • no public IP</text>
  <rect x="770" y="410" width="260" height="84" rx="10" class="public"/>
  <text x="900" y="442" text-anchor="middle" class="label">Public subnet B</text>
  <text x="900" y="469" text-anchor="middle" class="small">ALB network interface</text>
  <rect x="1074" y="410" width="260" height="84" rx="10" class="private"/>
  <text x="1204" y="442" text-anchor="middle" class="label">Private subnet B</text>
  <text x="1204" y="469" text-anchor="middle" class="small">Managed node • no public IP</text>

  <rect x="414" y="524" width="920" height="112" rx="12" class="private"/>
  <text x="438" y="556" class="label">Amazon EKS data plane | VPC CNI</text>
  <rect x="442" y="574" width="248" height="44" rx="8" class="node"/>
  <text x="566" y="602" text-anchor="middle" class="small">NodePort → Service</text>
  <rect x="716" y="574" width="260" height="44" rx="8" class="node"/>
  <text x="846" y="602" text-anchor="middle" class="small">payments namespace → web Pods</text>
  <rect x="1002" y="574" width="300" height="44" rx="8" class="node"/>
  <text x="1152" y="602" text-anchor="middle" class="small">Pod security + NetworkPolicy</text>
  <path d="M690 596 H708" class="flow"/>
  <path d="M976 596 H994" class="flow"/>

  <path d="M898 255 V286 H240 V402" class="flow-orange"/>
  <path d="M898 255 V286 H900 V402" class="flow-orange"/>
  <path d="M370 452 H406" class="flow-orange"/>
  <path d="M1030 452 H1066" class="flow-orange"/>
  <text x="474" y="511" class="tiny muted">ALB target group → NodePort; node security group trusts the ALB security group</text>
  <rect x="114" y="535" width="248" height="80" rx="10" class="evidence"/>
  <text x="238" y="568" text-anchor="middle" class="label">Internet Gateway</text>
  <text x="238" y="594" text-anchor="middle" class="small">Public subnet route</text>
  <rect x="114" y="624" width="248" height="70" rx="10" class="evidence"/>
  <text x="238" y="653" text-anchor="middle" class="label">NAT / VPC endpoints</text>
  <text x="238" y="679" text-anchor="middle" class="small">Controlled private egress</text>

  <rect x="48" y="744" width="446" height="142" rx="14" class="identity"/>
  <text x="72" y="780" class="section">3. Human administration</text>
  <text x="72" y="817" class="small">IAM Identity Center / federated role</text>
  <text x="72" y="847" class="small">EKS access entry → Kubernetes RBAC</text>
  <text x="72" y="873" class="tiny muted">VPN / Direct Connect / trusted in-VPC runner → private API</text>

  <rect x="526" y="744" width="446" height="142" rx="14" class="identity"/>
  <text x="550" y="780" class="section">4. Workload AWS identity</text>
  <text x="550" y="817" class="small">payments/web-reader service account</text>
  <text x="550" y="847" class="small">EKS Pod Identity → scoped IAM role</text>
  <text x="550" y="873" class="tiny muted">Short-lived credentials • no static keys in Pods</text>

  <rect x="1004" y="744" width="448" height="142" rx="14" class="evidence"/>
  <text x="1028" y="780" class="section">5. Audit and detection</text>
  <text x="1028" y="817" class="small">EKS audit/control-plane logs → CloudWatch</text>
  <text x="1028" y="847" class="small">AWS API activity → CloudTrail</text>
  <text x="1028" y="873" class="tiny muted">GuardDuty EKS Protection + Runtime Monitoring</text>

  <rect x="48" y="914" width="1404" height="108" rx="14" fill="#203b55"/>
  <text x="74" y="950" class="label white">Private EKS API endpoint</text>
  <text x="74" y="982" class="small white">EKS-managed control plane connects through VPC network interfaces. Nodes and operators reach the private endpoint on TCP 443.</text>
  <path d="M270 886 V906" class="flow-purple"/>
  <path d="M750 636 V736" class="flow-purple"/>
  <path d="M1300 636 V736" class="telemetry"/>
  <path d="M972 814 H996" class="telemetry"/>
  <text x="48" y="1054" class="tiny muted">Orange: public ingress • Blue: private workload path • Purple: identity and authorization • Dashed: telemetry and evidence</text>
</svg>
